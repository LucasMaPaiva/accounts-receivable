# Credenciais abaixo são só para desenvolvimento local; sobrescreva pelo .env.
x-database-url: &database-url "postgres://${POSTGRES_USER:-contas}:${POSTGRES_PASSWORD:-contas}@db:5432/${POSTGRES_DB:-contas}?sslmode=disable"
x-rabbitmq-url: &rabbitmq-url "amqp://${RABBITMQ_USER:-contas}:${RABBITMQ_PASSWORD:-contas}@rabbitmq:5672/"

# Monólito Laravel de exemplo (fase 4). Banco próprio em SQLite, num volume.
x-monolito: &monolito
  build: ./exemplos/monolito-laravel
  environment:
    DB_CONNECTION: sqlite
    DB_DATABASE: /app/database/dados/monolito.sqlite
    DB_BUSY_TIMEOUT: "5000" # fila, consumidor e artisan usam o mesmo arquivo
    DB_JOURNAL_MODE: wal
    QUEUE_CONNECTION: database
    CACHE_STORE: array
    SESSION_DRIVER: array
    LOG_CHANNEL: stderr
    RABBITMQ_URL: *rabbitmq-url
  volumes:
    - monolitodados:/app/database/dados

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contas}
      POSTGRES_DB: ${POSTGRES_DB:-contas}
    ports:
      - "127.0.0.1:${DB_PORTA:-5444}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-contas}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-contas}
    ports:
      - "127.0.0.1:${RABBITMQ_PORTA:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_PAINEL_PORTA:-15672}:15672" # painel: http://localhost:15672
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Roda as migrations e termina; API e worker só sobem se elas passarem.
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", *database-url, "up"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORTA:-8080}:8080"
    environment:
      PORTA: "8080"
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: *database-url
      RABBITMQ_URL: *rabbitmq-url
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Ferramenta de desenvolvimento: publica um venda.faturada como o monólito.
  # Uso: docker compose run --rm simular-venda -cliente c1 -valor 15000
  simular-venda:
    build: .
    entrypoint: ["/simular-venda"]
    environment:
      RABBITMQ_URL: *rabbitmq-url
    profiles: ["ferramentas"]

  # Servidor MCP só leitura (stdio). Usado pelo .mcp.json da raiz.
  mcp:
    build: .
    entrypoint: ["/mcp"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    profiles: ["ferramentas"]

  # Uso: make monolito-up (sobe os três abaixo junto com o serviço)
  monolito-migrate:
    <<: *monolito
    command: ["sh", "-c", "touch database/dados/monolito.sqlite && php artisan migrate --force"]
    profiles: ["monolito"]

  # queue:work publica venda.faturada (job PublicarVendaFaturada).
  monolito-fila:
    <<: *monolito
    command: ["php", "artisan", "queue:work", "--sleep=1"]
    depends_on:
      monolito-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["monolito"]

  # Consome titulo.pago e dá baixa na venda. A fila é declarada pelo worker Go.
  monolito-consumidor:
    <<: *monolito
    command: ["php", "artisan", "contas:consumir-titulos-pagos"]
    depends_on:
      monolito-migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    restart: unless-stopped
    profiles: ["monolito"]

  # Linha de comando do monólito. Uso: make faturar args="c1 15000"
  monolito:
    <<: *monolito
    profiles: ["ferramentas"]

volumes:
  dbdata:
  rabbitdata:
  monolitodados:
